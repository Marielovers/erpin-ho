name: Deploy Erpin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep test checks separate from publishing until tests are updated to
      # match the final model/game rules. The original repository has 9 failing tests.
      - name: Build website (installs Cubism Core through prebuild)
        run: npm run build

      - name: Verify generated Pages files
        run: |
          test -s dist/index.html || (echo 'ERROR: dist/index.html is missing' && exit 1)
          test -s dist/vendor/live2dcubismcore.min.js || (echo 'ERROR: Cubism Core is missing from dist/vendor' && exit 1)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
